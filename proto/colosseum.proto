syntax = "proto3";

package colosseum.v1;

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  HELLO = 1;
  REGISTERED = 2;
  MATCH_REQUEST = 3;
  MATCHED = 4;
  SESSION_READY = 5;
  OBSERVATION = 6;
  ACTION_PLAN = 7;
  RESET = 8;
  SESSION_CLOSE = 9;
  ERROR = 10;
  LOCAL_CONTROL = 30;
}

enum PeerRole {
  PEER_ROLE_UNSPECIFIED = 0;
  CLIENT = 1;
  POLICY_SERVER = 2;
}

enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  FLOAT32 = 1;
  FLOAT64 = 2;
  UINT8 = 3;
  INT32 = 4;
  INT64 = 5;
}

enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  JPEG = 1;
  PNG = 2;
  RAW_RGB = 3;
}

message RelayFrame {
  uint32 protocol_version = 1;
  MessageType type = 2;
  string session_id = 3;
  uint64 sequence = 4;
  uint64 sent_at_ns = 5;
  uint32 deadline_ms = 6;
  bytes payload = 7;
}

message ActionSpaceSpec {
  string name = 1;
  uint32 action_dim = 2;
}

message RobotSpec {
  string robot_type = 1;
  uint32 joint_count = 2;
  bool has_gripper = 3;
  uint32 control_hz = 4;
  repeated ActionSpaceSpec action_spaces = 5;
}

message Hello {
  PeerRole role = 1;
  string peer_id = 2;
  string policy_id = 3;
  RobotSpec robot = 4;
}

message Registered {
  string peer_id = 1;
}

message MatchRequest {
  string requested_policy_id = 1;
}

message MatchResult {
  string session_id = 1;
  string policy_server_id = 2;
  string policy_id = 3;
  RobotSpec robot = 4;
}

message SessionReady {
  string policy_id = 1;
  string policy_revision = 2;
  repeated string action_spaces = 3;
  uint32 control_hz = 4;
  uint32 max_horizon = 5;
}

message Tensor {
  repeated uint32 shape = 1;
  DataType dtype = 2;
  bytes data = 3;
}

message Image {
  string sensor_id = 1;
  ImageEncoding encoding = 2;
  uint64 capture_time_ns = 3;
  uint32 width = 4;
  uint32 height = 5;
  bytes data = 6;
}

message Observation {
  uint64 robot_time_ns = 1;
  uint64 control_step = 2;
  string instruction = 3;
  map<string, Tensor> state = 4;
  repeated Image sensors = 5;
}

message ActionPlan {
  uint64 request_sequence = 1;
  uint64 plan_id = 2;
  uint64 start_step = 3;
  uint64 valid_until_step = 4;
  uint32 control_hz = 5;
  Tensor actions = 6;
  // The policy declares the task complete; actions must be zeros and the Client ends the trial.
  bool done = 7;
}

message ResetRequest {
  string reason = 1;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

// Local control messages use RelayFrame(type=LOCAL_CONTROL), never JSON text.
message LocalModelSpec {
  string url = 1;
  string revision = 2;
  // Legacy Router metadata: echo unchanged, never use for backend selection.
  optional string runtime_profile = 3;
  string action_space = 4;
  uint32 action_dim = 5;
  uint32 control_hz = 6;
  uint32 max_horizon = 7;
  optional string subfolder = 8;
  // Absent means legacy VLA. For LLM, name is the provider API model name.
  optional string model_type = 9;
  optional string name = 10;
}
message LocalTaskSpec {
  optional string id = 1;
  optional string robot_id = 2;
  optional string instruction = 3;
  optional string setup = 4;
  optional string success_criteria = 5;
  optional string partial_success_criteria = 6;
  uint32 max_steps = 7;
  repeated string cameras = 8;
}
message LocalControl {
  // Client -> Policy Server: hardware identity, independent of model_type.
  optional string robot_type = 21;
  // Client -> Policy Server only. Never echo, persist, or send to Router.
  optional string api_key = 20;
  optional bool test = 19;
  string type = 1;
  uint32 protocol_version = 2;
  string run_id = 3;
  string preparation_id = 4;
  LocalModelSpec model = 5;
  LocalTaskSpec task = 6;
  reserved 7;
  reserved "runtime_profiles";
  optional bool verification_only = 8;
  optional bool loaded = 9;
  string transport = 10;
  string state = 11;
  optional uint32 step = 12;
  string code = 13;
  string message = 14;
  uint32 observation_sequence = 15;
  uint32 sensor_count = 16;
  uint32 state_count = 17;
  string data_sha256 = 18;
}
