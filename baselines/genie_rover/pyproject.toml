[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genie-rover"
version = "0.1.0"
description = "GeNIE (NUS CLeAR Lab, Earth Rover Challenge 2025 winner) as an Earth Rovers SDK navigation policy for the Earth Rover Mini+"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "requests>=2.31",
  "torch>=2.5.1",
  "torchvision>=0.20",
  "hydra-core>=1.3.2",
  "iopath>=0.1.10",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "PyYAML>=6",
  "gdown>=5.2",
  # SAM-TP and the GeNIE BEV path planner, used unchanged from the authors' repository.
  "sam-tp @ git+https://github.com/jiaming-ai/GENIE-SAMTP.git@728aee296cf44288356de683b1948f18b05917d6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
genie-rover = "genie_rover.run:main"
genie-rover-weights = "genie_rover.weights:main"
genie-rover-replay = "genie_rover.replay:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
